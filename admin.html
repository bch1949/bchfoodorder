<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - จัดการเมนูอาหาร BCH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Anuphan', sans-serif; padding-bottom: 50px; }
        .navbar-custom { background: #2d3436; color: white; padding: 15px 0; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-switch .form-check-input { width: 3em; height: 1.5em; cursor: pointer; }
        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .menu-item:last-child { border-bottom: none; }
        .status-badge { font-size: 0.85rem; width: 60px; text-align: center; }
    </style>
</head>
<body>

    <nav class="navbar navbar-custom sticky-top">
        <div class="container d-flex justify-content-between">
            <span class="navbar-brand mb-0 h1 fw-bold text-white"><i class="fas fa-cogs me-2"></i>BCH Food Admin</span>
            <button class="btn btn-sm btn-outline-light" onclick="loadData()"><i class="fas fa-sync-alt"></i> รีเฟรช</button>
        </div>
    </nav>

    <div class="container mt-4">
        <ul class="nav nav-pills nav-fill bg-white p-1 rounded shadow-sm mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" id="tab-menu1" data-bs-toggle="tab" data-bs-target="#menu1" type="button" role="tab">อาหารตามสั่ง</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="tab-menu2" data-bs-toggle="tab" data-bs-target="#menu2" type="button" role="tab">ข้าวราดแกง (<span id="day-label">...</span>)</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fw-bold" id="tab-menutoday" data-bs-toggle="tab" data-bs-target="#menutoday" type="button" role="tab">เมนูพิเศษ</button>
            </li>
        </ul>

        <div class="tab-content" id="adminTabsContent">
            <!-- Tab อาหารตามสั่ง -->
            <div class="tab-pane fade show active" id="menu1" role="tabpanel">
                <div class="card"><div class="card-body p-0" id="list-menu1"></div></div>
            </div>
            
            <!-- Tab ข้าวราดแกง -->
            <div class="tab-pane fade" id="menu2" role="tabpanel">
                <div class="card"><div class="card-body p-0" id="list-menu2"></div></div>
            </div>

            <!-- Tab เมนูพิเศษ -->
            <div class="tab-pane fade" id="menutoday" role="tabpanel">
                <div class="card"><div class="card-body p-0" id="list-menutoday"></div></div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // **********************************************************
        // ⚠️ เอาลิงก์ Web App (ตัวใหม่ที่ Deploy ล่าสุด) มาใส่ตรงนี้ ⚠️
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLp6Unn3Af6lm-AYkdhN5JJmApndthcYqprh4_7daG-ktNxgrVVVie8_28PDUVwwqEVw/exec"; 
        // **********************************************************
        
        var currentDayStr = "";

        $(document).ready(function() {
            loadData();
        });

        function loadData() {
            Swal.fire({ title: 'กำลังโหลดข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
            
            fetch(SCRIPT_URL + "?action=getAdminMenuData", { method: 'POST', body: JSON.stringify({}) })
            .then(res => res.json())
            .then(res => {
                Swal.close();
                if(res.status) {
                    currentDayStr = res.data.dayStr;
                    $('#day-label').text('วันที่ ' + currentDayStr);
                    renderList('list-menu1', res.data.menu1, 'menu1');
                    renderList('list-menu2', res.data.menuday, currentDayStr); // ชื่อชีตเป็นวันที่
                    renderList('list-menutoday', res.data.menutoday, 'menutoday');
                } else {
                    Swal.fire('Error', 'ไม่สามารถโหลดข้อมูลได้', 'error');
                }
            }).catch(err => {
                Swal.fire('Error', 'เชื่อมต่อขัดข้อง', 'error');
            });
        }

        function renderList(containerId, items, sheetName) {
            let html = "";
            if(items.length === 0) {
                html = '<div class="p-4 text-center text-muted">ไม่พบข้อมูลเมนูในชีตนี้</div>';
            } else {
                items.forEach((item) => {
                    let checked = item.status ? "checked" : "";
                    let badgeClass = item.status ? "bg-success" : "bg-danger";
                    let badgeText = item.status ? "เปิดขาย" : "หมด";
                    
                    html += `
                    <div class="menu-item">
                        <div class="fw-bold fs-6">${item.name}</div>
                        <div class="d-flex align-items-center gap-3">
                            <span class="badge ${badgeClass} status-badge" id="badge-${sheetName}-${item.row}">${badgeText}</span>
                            <div class="form-check form-switch m-0">
                                <input class="form-check-input" type="checkbox" role="switch" ${checked} 
                                onchange="toggleStatus('${sheetName}', ${item.row}, this)">
                            </div>
                        </div>
                    </div>`;
                });
            }
            $('#' + containerId).html(html);
        }

        function toggleStatus(sheetName, row, toggleElement) {
            let isChecked = $(toggleElement).is(':checked');
            let badge = $(`#badge-${sheetName}-${row}`);
            
            // เปลี่ยนสี Badge ชั่วคราวเพื่อให้ UI ดูตอบสนองทันที
            badge.removeClass('bg-success bg-danger').addClass(isChecked ? 'bg-success' : 'bg-danger').text(isChecked ? 'เปิดขาย' : 'หมด');
            
            // ส่งค่าไปอัปเดต Google Sheet
            fetch(SCRIPT_URL + "?action=toggleMenuStatus", {
                method: 'POST',
                body: JSON.stringify({ sheetName: sheetName, row: row, status: isChecked })
            })
            .then(res => res.json())
            .then(data => {
                if(!data.status) {
                    // หากอัปเดตไม่สำเร็จ ให้เด้งกลับค่าเดิม
                    $(toggleElement).prop('checked', !isChecked);
                    badge.removeClass('bg-success bg-danger').addClass(!isChecked ? 'bg-success' : 'bg-danger').text(!isChecked ? 'เปิดขาย' : 'หมด');
                    Swal.fire({icon: 'error', title: 'ผิดพลาด', text: data.msg, toast: true, position: 'top-end', timer: 3000, showConfirmButton: false});
                } else {
                    // หากอัปเดตสำเร็จ แสดง Toast เล็กๆ มุมขวา
                    const Toast = Swal.mixin({ toast: true, position: "top-end", showConfirmButton: false, timer: 1500 });
                    Toast.fire({ icon: "success", title: "อัปเดตสถานะสำเร็จ" });
                }
            }).catch(err => {
                $(toggleElement).prop('checked', !isChecked);
                badge.removeClass('bg-success bg-danger').addClass(!isChecked ? 'bg-success' : 'bg-danger').text(!isChecked ? 'เปิดขาย' : 'หมด');
                Swal.fire({icon: 'error', title: 'การเชื่อมต่อมีปัญหา', toast: true, position: 'top-end', timer: 3000, showConfirmButton: false});
            });
        }
    </script>
</body>
</html>
